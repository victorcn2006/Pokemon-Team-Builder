<!DOCTYPE html>
<html>
    <head>
        <title>Pokemon Team Builder</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
        <link rel="stylesheet" href="css/colours.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/buttons.css">
    </head>
    <body class="light-mode">
        <div class="body-flex-container">
            <div class="flex-item top-6">
                <div class="frontpage-left-logo-container">
                    <img class="frontpage-image-logo" src="assets/images/Pokemon_logo.png" alt="Logo">
                </div>
                <div class="empty-center-container"></div>
                <div class="right-top-container">
                    <button class="t-white-black-button">Log In / Register</button>
                </div>
            </div>
            <div class="flex-item center-auto">
                <div class="flex-center-horizontal-container">
                    <div class="h-flex-item left">
                        <div class="top-pokemon-container">
                            <img class="pokemon-container" src="assets/images/pokemons/pikachu.png" alt="Pikachu">
                        </div>
                        <div class="bottom-pokemon-container">
                            <img class="pokemon-container" src="assets/images/pokemons/psyduck.png" alt="Psyduck">
                        </div>
                    </div>
                    <div class="h-flex-item center">
                        <div class="top-title-container">
                            <div class="title-container">
                                <h1 class="frontpage-title">Build your perfect Pokémon Team</h1>
                            </div>
                            
                        </div>
                        <div class="description-container">
                            <div class="description-text-container">
                                <h4 class="frontpage-description">Create unbeatable teams with our pokemon team builder.
                                    Plan your strategy and dominate every battle.
                                </h4>
                            </div>
                        </div>
                        <div class="center-info-container">
                            <div class="info-container">
                                <div class="info-layout">
                                    <div class="bar-item-container">
                                        <h3 class="frontpage-info">1000+</h3>
                                        
                                    </div>
                                    <div class="bar-item-container">
                                        <h3 class="frontpage-description">Pokémon available</h3>
                                    </div>
                                </div>
                                <div class="info-layout">
                                    <div class="bar-item-container">
                                        <h3 class="frontpage-info">+20</h3>
                                        
                                    </div>
                                    <div class="bar-item-container">
                                        <h3 class="frontpage-description">Games Supported</h3>
                                    </div>
                                </div>
                                <div class="info-layout">
                                    <div class="bar-item-container">
                                        <h3 class="frontpage-info">Ꝏ</h3>
                                        
                                    </div>
                                    <div class="bar-item-container">
                                        <h3 class="frontpage-description">Team Combinations</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="bottom-button-container">
                            <div class="button-container">
                                <button class="t-white-black-button">
                                    <a href=""></a>
                                    Start Team Building
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="h-flex-item right">
                        <div class="top-pokemon-container">
                            <img class="pokemon-container" src="assets/images/pokemons/ditto.png" alt="Ditto">
                        </div>
                        <div class="bottom-pokemon-container">
                            <img class="pokemon-container" src="assets/images/pokemons/meowth.png" alt="Meowth">
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex-item bottom-30">
                <div class="top-pokemon-container">
                    <img class="pokemon-container" src="assets/images/pokemons/eevee.png" alt="Eeve">
                </div>
                <div class="top-pokemon-container">
                    <img class="pokemon-container" src="assets/images/pokemons/snorlax.png" alt="Snorlax">
                </div>
                <div class="top-pokemon-container">
                    <img class="pokemon-container" src="assets/images/pokemons/mewtwo.png" alt="Mewtwo">
                </div>
                <div class="top-pokemon-container">
                    <img class="pokemon-container" src="assets/images/pokemons/bulbasaur.png" alt="Bulbasaur">
                </div>
                <div class="top-pokemon-container">
                    <img class="pokemon-container" src="assets/images/pokemons/mew.png" alt="Mew">
                </div>
                <div class="top-pokemon-container">
                    <img class="pokemon-container" src="assets/images/pokemons/chansey.png" alt="Chansey">
                </div>
            </div>
        </div>
    </body>
</html>
